<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>세션 만료 — golive.wiki</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="https://golive.wiki/"/>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0a0c;
    color: #fafafa;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: #15151a;
    border: 1px solid #26262d;
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(20, 235, 192, 0.08);
    color: #14ebc0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #14ebc0;
    box-shadow: 0 0 0 4px rgba(20, 235, 192, 0.18);
  }
  h1 { margin: 0 0 10px; font-size: 22px; font-weight: 700; }
  p.lead { margin: 0 0 22px; color: #b6b6c2; font-size: 14px; line-height: 1.55; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: inline-block;
    padding: 12px 16px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    transition: background 0.15s ease, transform 0.05s ease;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: #14ebc0; color: #0a0a0c; }
  .btn-primary:hover { background: #11d4ad; }
  .btn-ghost { background: transparent; color: #fafafa; border-color: #2a2a33; }
  .btn-ghost:hover { background: #1a1a22; }
  .meta { margin-top: 18px; font-size: 12px; color: #6f6f7c; }
  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<main class="card" role="alert">
  <span class="badge">Session expired · 401</span>
  <h1>세션이 만료되었습니다</h1>
  <p class="lead">
    보안을 위해 오래 사용하지 않은 세션은 자동으로 종료됩니다.<br/>
    다시 로그인하거나 메인으로 돌아가 작업을 이어서 진행해 주세요.
  </p>
  <div class="actions">
    <a class="btn btn-primary" href="https://golive.wiki/?login=1">다시 로그인</a>
    <a class="btn btn-ghost" href="https://golive.wiki/">메인으로 돌아가기</a>
  </div>
  <p class="meta">
    문제가 반복되면 <a href="https://golive.wiki/" style="color:#14ebc0; text-decoration:none;">support</a>로 문의해 주세요.
  </p>
</main>
</body>
</html>
